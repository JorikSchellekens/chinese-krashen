<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f0">
  <title>Tone trainer</title>
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/tones.css">
</head>
<body class="tones">
  <header>
    <a class="icon-btn back" href="/" aria-label="Back to reader">&#8592;</a>
    <div class="brand">Tones <span class="i-plus">i+1</span></div>
    <div class="spacer"></div>
    <select id="voice" class="mini-select" aria-label="Voice"></select>
  </header>

  <nav class="modes" id="modes" aria-label="Drill mode">
    <button class="mode" data-mode="single">Hear the tone</button>
    <button class="mode" data-mode="pairs">Tone pairs</button>
    <button class="mode" data-mode="shadow">Shadow</button>
    <button class="mode" data-mode="speak">Say it</button>
  </nav>

  <main id="stage" aria-live="polite"></main>

  <footer id="scoreboard">
    <span id="streak"></span>
    <span id="tally"></span>
    <button id="resetStats" class="linkish" hidden>reset</button>
  </footer>

  <div id="status" class="status" hidden></div>
  <script src="/tones.js"></script>
</body>
</html>
